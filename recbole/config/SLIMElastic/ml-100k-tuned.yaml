# ─── SLIM base-model config ────────────────────────────────────────────────────
# Matches RecBole's own config format exactly.
# Run with: python run_recbole.py --config_files configs/SLIM/ml-100k.yaml

model: SLIMElastic
dataset: ml-100k
data_path: dataset/

embedding_size: 64
train_neg_sample_args:
  distribution: uniform
  sample_num: 1

# Training
epochs: 20
train_batch_size: 2048
learner: adam
learning_rate: 0.001
eval_step: 10
stopping_step: 20

# alpha and l1_ratio are both float-type values to control the balance between L1 and L2 norm.
# The weight of L1-norm used in ElasticNet is equal to alpha * l1_ratio. 
# The weight of L2-norm used in ElasticNet is 1/2 * alpha * (1 - l1_ratio).
alpha: 0.2
l1_ratio: 0.01
positive_only: True             # (bool) Whether to add the non-negativity constraint. 
hide_item: True                 # (bool) Whether to ignore the influence of the item itself.


# Evaluation
eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  group_by: user
  order: RO
  mode: full
metrics: [Recall, MRR, NDCG, Hit, Precision]
topk: [10]
valid_metric: MRR@10
