# ─── ItemKNN base-model config ────────────────────────────────────────────────────
# Matches RecBole's own config format exactly.
# Run with: python run_recbole.py --config_files configs/ItemKNN/ml-100k.yaml

model: ItemKNN
dataset: ml-100k
data_path: dataset/

# Training
k: 100                          # (int) The neighborhood size.
knn_method: 'item'              # (string) The method to calculate the similarity matrix ['item','user']
shrink: 100

# Evaluation
eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  group_by: user
  order: RO
  mode: full
metrics: [Recall, MRR, NDCG, Hit, Precision]
topk: [10]
valid_metric: MRR@10







